<script>
const TN={"ori": "Origen y territorio", "vid": "Vida y cultura", "con": "Conquista y legado"};
const Q=[{"c": "ori", "t": "m", "q": "¿A qué gran familia de pueblos pertenecían los pocomames?", "o": ["A los mayas", "A los nahuas", "A los incas", "A los aztecas"], "e": "Los pocomames (poqomam) son un pueblo maya."}, {"c": "ori", "t": "m", "q": "¿Cómo se escribe hoy su nombre en su propio idioma?", "o": ["Poqomam", "Pipil", "Lenca", "Kakawira"], "e": "Hoy se escribe poqomam."}, {"c": "ori", "t": "m", "q": "¿En qué zona de El Salvador vivían los pocomames?", "o": ["En el occidente, cerca de la frontera con Guatemala", "En el oriente, junto al golfo de Fonseca", "En Morazán", "En las islas"], "e": "Vivían en el occidente, cerca de lo que hoy es Guatemala."}, {"c": "ori", "t": "m", "q": "¿Qué ciudades de El Salvador se relacionan con los pocomames?", "o": ["Chalchuapa y Ahuachapán", "San Miguel y La Unión", "Cacaopera y Lislique", "Citalá y Tejutla"], "e": "Los documentos los ubican sobre todo en Chalchuapa y Ahuachapán (y quizá Atiquizaya)."}, {"c": "ori", "t": "m", "q": "¿En qué departamentos actuales quedan Chalchuapa y Ahuachapán?", "o": ["Santa Ana y Ahuachapán", "Morazán y La Unión", "San Salvador y La Libertad", "Chalatenango y Cabañas"], "e": "Chalchuapa está en Santa Ana; Ahuachapán es su propio departamento."}, {"c": "ori", "t": "m", "q": "¿En qué país vecino viven todavía muchos pocomames?", "o": ["Guatemala", "Honduras", "Nicaragua", "México"], "e": "El idioma poqomam sigue vivo en Guatemala."}, {"c": "ori", "t": "v", "q": "Los pocomames llegaron a El Salvador desde territorio que hoy es Guatemala.", "a": true, "e": "¡Cierto! Se extendieron desde las tierras altas de Guatemala hacia el occidente salvadoreño."}, {"c": "ori", "t": "m", "q": "¿Qué otro pueblo maya vivía en el norte de El Salvador, cerca de los pocomames?", "o": ["Los chortís", "Los incas", "Los chorotegas", "Los aztecas"], "e": "Los chortís vivían en el norte (Chalatenango y Metapán)."}, {"c": "ori", "t": "m", "q": "¿Qué idioma hablaban los pocomames?", "o": ["El poqomam, una lengua maya", "El náhuat", "El potón", "El inglés"], "e": "Hablaban poqomam, de la familia de lenguas mayas."}, {"c": "ori", "t": "v", "q": "El idioma poqomam ya no se habla en El Salvador, pero sí en Guatemala.", "a": true, "e": "¡Cierto! Desapareció en El Salvador, pero sigue vivo en Guatemala."}, {"c": "ori", "t": "m", "q": "¿Qué pueblo llegó después y ocupó gran parte del occidente, incluido territorio pocomam?", "o": ["Los nahuas-pipiles", "Los incas", "Los vikingos", "Los chorotegas"], "e": "Los pipiles se expandieron por el occidente y convivieron con los pocomames."}, {"c": "ori", "t": "m", "q": "¿Qué famoso sitio arqueológico maya está en Chalchuapa?", "o": ["Tazumal", "Machu Picchu", "Teotihuacán", "Chichén Itzá"], "e": "Tazumal está en Chalchuapa. Es muy antiguo; no se sabe con certeza si lo construyeron los pocomames."}, {"c": "ori", "t": "v", "q": "Es seguro que los pocomames construyeron Tazumal.", "a": false, "e": "Falso. Tazumal es más antiguo; los historiadores no lo atribuyen con seguridad a los pocomames."}, {"c": "ori", "t": "m", "q": "¿Qué significa «Chalchuapa», según la explicación más común?", "o": ["Río de jade o de piedras preciosas", "Cerro de fuego", "Tierra de lagos fríos", "Valle de tabaco"], "e": "Se suele explicar como «río de las piedras preciosas» (jade). Es un nombre náhuat."}, {"c": "vid", "t": "m", "q": "¿Cuál era el cultivo principal de los pocomames?", "o": ["El maíz", "El trigo", "El arroz", "La uva"], "e": "Como todos los pueblos mayas, dependían del maíz."}, {"c": "vid", "t": "m", "q": "¿Qué otros alimentos sembraban?", "o": ["Frijol, ayote y chile", "Manzanas y peras", "Trigo y cebada", "Café y caña"], "e": "La milpa: maíz, frijol, ayote (calabaza) y chile."}, {"c": "vid", "t": "m", "q": "¿Qué producto valioso servía para comerciar en la región?", "o": ["El cacao", "El petróleo", "El oro de minas", "La seda"], "e": "El cacao era muy valioso en Mesoamérica y servía como moneda."}, {"c": "vid", "t": "m", "q": "¿Cómo se llama la siembra tradicional de maíz, frijol y ayote juntos?", "o": ["La milpa", "El huerto de trigo", "La viña", "El arrozal"], "e": "La milpa es el sistema de cultivo mesoamericano."}, {"c": "vid", "t": "v", "q": "Los pocomames creían en varios dioses relacionados con la naturaleza.", "a": true, "e": "¡Cierto! Como otros pueblos mayas, eran politeístas."}, {"c": "vid", "t": "m", "q": "¿Por qué eran importantes para ellos el sol y la lluvia?", "o": ["Porque de ellos dependían las cosechas", "Porque no comían maíz", "Porque vivían en la nieve", "Porque usaban paneles solares"], "e": "Eran agricultores: necesitaban sol y lluvia para la milpa."}, {"c": "vid", "t": "m", "q": "¿Qué artesanía hacían con barro?", "o": ["Cerámica: ollas, cántaros y vasijas", "Ladrillos de vidrio", "Estatuas de bronce", "Platos de plástico"], "e": "Los pueblos mayas eran grandes alfareros."}, {"c": "vid", "t": "m", "q": "¿Con qué tejían su ropa?", "o": ["Algodón", "Lana de oveja", "Seda", "Nylon"], "e": "Usaban algodón; las ovejas llegaron con los españoles."}, {"c": "vid", "t": "m", "q": "¿Con qué construían sus casas sencillas?", "o": ["Bahareque, madera y techo de paja", "Acero y vidrio", "Mármol", "Hielo"], "e": "Las casas comunes eran de bahareque o adobe con techo de paja."}, {"c": "vid", "t": "m", "q": "¿Cómo estaba organizada su sociedad, como la de otros mayas?", "o": ["Con señores y nobles, sacerdotes y gente común", "Todos eran reyes", "No tenían líderes", "Los niños mandaban"], "e": "Había gobernantes y nobles, sacerdotes, artesanos y campesinos."}, {"c": "vid", "t": "m", "q": "¿Qué usaban para moler el maíz?", "o": ["La piedra de moler", "Una licuadora", "Un molino eléctrico", "Un martillo de hierro"], "e": "La piedra de moler se usa desde hace miles de años."}, {"c": "vid", "t": "v", "q": "Los pocomames tenían contacto y comercio con los pueblos vecinos.", "a": true, "e": "¡Cierto! En Mesoamérica los pueblos intercambiaban productos como cacao, sal y obsidiana."}, {"c": "vid", "t": "m", "q": "¿Qué piedra negra y filosa usaban para hacer cuchillos y puntas?", "o": ["La obsidiana", "El diamante", "El hierro", "El plástico"], "e": "La obsidiana es un vidrio volcánico que corta muy bien."}, {"c": "con", "t": "m", "q": "¿Quiénes conquistaron el territorio pocomam en el siglo XVI?", "o": ["Los españoles", "Los ingleses", "Los romanos", "Los japoneses"], "e": "Los españoles llegaron en el siglo XVI (desde 1524)."}, {"c": "con", "t": "m", "q": "¿Desde qué país llegaron los conquistadores al occidente salvadoreño?", "o": ["Desde Guatemala", "Desde Panamá", "Desde Cuba", "Desde Brasil"], "e": "Pedro de Alvarado entró desde Guatemala en 1524."}, {"c": "con", "t": "m", "q": "¿En qué año comenzó la conquista española de El Salvador?", "o": ["1524", "1492", "1821", "1950"], "e": "La conquista empezó en 1524."}, {"c": "con", "t": "v", "q": "Después de la conquista, poco a poco se dejó de hablar poqomam en El Salvador.", "a": true, "e": "¡Cierto! El castellano lo fue reemplazando."}, {"c": "con", "t": "m", "q": "¿Qué religión trajeron los españoles?", "o": ["El cristianismo católico", "El budismo", "El islam", "Ninguna"], "e": "Los misioneros enseñaron la religión católica."}, {"c": "con", "t": "m", "q": "¿Qué causó la muerte de muchos indígenas después de la llegada de los españoles?", "o": ["Enfermedades nuevas, como la viruela", "El frío de la nieve", "Los terremotos solamente", "Los dinosaurios"], "e": "Las enfermedades europeas causaron muchas muertes."}, {"c": "con", "t": "m", "q": "¿Dónde podemos aprender hoy sobre los antiguos pueblos del occidente?", "o": ["En sitios como Tazumal y Casa Blanca, en Chalchuapa", "En la Torre Eiffel", "En el Polo Norte", "En la Luna"], "e": "Chalchuapa tiene sitios arqueológicos y museos."}, {"c": "con", "t": "m", "q": "¿Cuál de estos alimentos de hoy es herencia de los pueblos mayas?", "o": ["Las tortillas y tamales de maíz", "Las pizzas", "Las hamburguesas", "El sushi"], "e": "El maíz es herencia de los pueblos originarios."}, {"c": "con", "t": "v", "q": "Los pocomames de Guatemala todavía hablan su idioma y conservan tradiciones.", "a": true, "e": "¡Cierto! Hay comunidades poqomam en Guatemala, como en Palín y San Luis Jilotepeque."}, {"c": "con", "t": "m", "q": "¿Qué podemos hacer para respetar a los pueblos originarios?", "o": ["Conocer y valorar su historia y cultura", "Burlarnos de ellos", "Olvidarlos", "Destruir sus sitios"], "e": "Valorar su historia es parte de nuestra identidad."}, {"c": "con", "t": "m", "q": "¿Cuántos pueblos mayas distintos vivieron en El Salvador según los historiadores?", "o": ["Por lo menos dos: pocomames y chortís", "Ninguno", "Solo los incas", "Cincuenta"], "e": "Pocomames en el occidente y chortís en el norte."}, {"c": "con", "t": "v", "q": "El Salvador fue un país donde vivieron varios pueblos originarios diferentes.", "a": true, "e": "¡Cierto! Pipiles, lencas, kakawiras, chortís, pocomames, chorotegas y otros."}, {"c": "con", "t": "m", "q": "¿Qué es un sitio arqueológico?", "o": ["Un lugar donde se estudian restos de pueblos antiguos", "Un centro comercial", "Un estadio", "Un aeropuerto"], "e": "Los arqueólogos estudian lo que dejaron los pueblos antiguos."}];
const CARDS={"ori": [["¿Quiénes eran los pocomames?", "Un pueblo maya que vivió en el occidente de El Salvador."], ["Nombre", "Hoy se escribe poqomam."], ["¿Dónde vivieron?", "En el occidente, sobre todo en Chalchuapa y Ahuachapán (quizá también Atiquizaya)."], ["Origen", "Llegaron desde las tierras altas de lo que hoy es Guatemala."], ["Idioma", "El poqomam, lengua maya. Ya no se habla en El Salvador, pero sí en Guatemala."], ["Vecinos", "Pipiles (llegaron después) y chortís, otro pueblo maya del norte."]], "vid": [["Alimentación", "La milpa: maíz, frijol, ayote y chile."], ["Comercio", "Cacao, sal y obsidiana se intercambiaban en Mesoamérica."], ["Religión", "Varios dioses ligados a la naturaleza: sol, lluvia, tierra."], ["Artesanías", "Cerámica, tejidos de algodón y herramientas de obsidiana."], ["Casas", "De bahareque o adobe con techo de paja."], ["Obsidiana", "Vidrio volcánico para cuchillos y puntas."]], "con": [["La conquista", "Los españoles llegaron desde Guatemala a partir de 1524."], ["Cambios", "Llegaron el castellano, la religión católica y enfermedades nuevas."], ["Su idioma hoy", "Desapareció en El Salvador; vive en Guatemala (Palín, San Luis Jilotepeque)."], ["Para visitar", "Tazumal y Casa Blanca, en Chalchuapa (Santa Ana)."], ["Ojo", "No se sabe con certeza quién construyó Tazumal; es más antiguo que los registros pocomames."]]};
Q.forEach((q,i)=>q.id=i);
const $=id=>document.getElementById(id);
let pool=[],cur=null,score=0,streak=0,done=0,missed={},answered=false,chal=false,timer=null,left=0,weight={},last=-1;
$("best").textContent=localStorage.getItem("pocomames_best")||0;
function show(id){["home","study","play","sum"].forEach(x=>$(x).classList.toggle("hid",x!==id))}
function home(){stop();$("best").textContent=localStorage.getItem("pocomames_best")||0;show("home")}
function sel(){const s=[...document.querySelectorAll("#topics input:checked")].map(i=>i.value);return s.length?s:["ori","vid","con"]}
let fcT="ori",fcI=0,fcF=false;
function showStudy(){$("stTabs").innerHTML=Object.keys(TN).map(k=>`<button class="btn ${k==fcT?'g':'gray'}" onclick="fcT='${k}';fcI=0;showStudy()">${TN[k]}</button>`).join("");$("stTitle").textContent="📖 "+TN[fcT];fcF=false;drawFc();show("study")}
function drawFc(){const c=CARDS[fcT][fcI];$("fc").innerHTML=fcF?`<div>${c[1]}</div>`:`<b>${c[0]}</b>`}
function flip(){fcF=!fcF;drawFc()}
function moveFc(d){const n=CARDS[fcT].length;fcI=(fcI+d+n)%n;fcF=false;drawFc();$("stTitle").textContent=`📖 ${TN[fcT]} (${fcI+1}/${n})`}
function begin(list,isChal){pool=list;score=0;streak=0;done=0;missed={};weight={};last=-1;chal=isChal;list.forEach(q=>weight[q.id]=1);
$("sc").textContent=0;$("st").textContent=0;show("play");stop();
if(chal){left=60;$("tm").classList.remove("hid");$("tm").textContent="⏱️ 60";timer=setInterval(()=>{left--;$("tm").textContent="⏱️ "+left;if(left<=0)finish()},1000)}else $("tm").classList.add("hid");next()}
function startPractice(){const s=sel();begin(Q.filter(q=>s.includes(q.c)),false)}
function startChallenge(){const s=sel();begin(Q.filter(q=>s.includes(q.c)),true)}
function repeatErrors(){begin(Q.filter(q=>missed[q.id]),false)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function pick(){let tot=0;const c=pool.filter(q=>q.id!==last||pool.length==1);c.forEach(q=>tot+=weight[q.id]);let r=Math.random()*tot;for(const q of c){r-=weight[q.id];if(r<=0)return q}return c[0]}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function next(){cur=pick();last=cur.id;answered=false;$("tg").textContent=TN[cur.c]+(cur.t=="v"?" · ¿Verdadero o falso?":"");
$("qt").textContent=cur.q;$("cnt").textContent="Preguntas: "+done;
let opts,right;if(cur.t=="m"){opts=shuf(cur.o);right=cur.o[0]}else if(cur.t=="v"){opts=["Verdadero","Falso"];right=cur.a?"Verdadero":"Falso"}else{opts=["Mayas","Pipiles"];right=cur.a}
cur.right=right;$("opts").innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.className="btn opt";b.textContent=o;b.onclick=()=>answer(b,o);$("opts").appendChild(b)});
$("msg").textContent="";$("exp").classList.add("hid");$("nx").classList.add("hid")}
const GOOD=["¡Muy bien! 🎉","¡Excelente! ⭐","¡Correcto! 👏","¡Eres un crack! 🚀","¡Súper! 💪"];
function answer(b,o){if(answered)return;answered=true;done++;const ok=o===cur.right;
[...$("opts").children].forEach(x=>{if(x.textContent===cur.right)x.classList.add("ok")});
if(ok){score++;streak++;weight[cur.id]=Math.max(1,weight[cur.id]-1);$("msg").textContent=GOOD[Math.floor(Math.random()*GOOD.length)]+(streak>=3?` ¡Racha de ${streak}! 🔥`:"")}
else{b.classList.add("bad");streak=0;missed[cur.id]=1;weight[cur.id]+=3;$("msg").textContent="¡Casi! Mira la respuesta correcta 💡"}
$("sc").textContent=score;$("st").textContent=streak;$("cnt").textContent="Preguntas: "+done;
if(chal){setTimeout(()=>{if(chal&&left>0)next()},ok?600:1600);return}
$("exp").textContent="ℹ️ "+cur.e;$("exp").classList.remove("hid");$("nx").classList.remove("hid")}
function finish(){stop();const wasChal=chal;chal=false;let t="¡Buen trabajo, "+NM()+"! 🌟";
if(wasChal){const best=+(localStorage.getItem("pocomames_best")||0);if(score>best){localStorage.setItem("pocomames_best",score);t="🏆 ¡Nuevo récord: "+score+"!"}}
$("sumT").textContent=t;$("sumP").textContent=`Respondiste bien ${score} de ${done} preguntas.`;
const m=Q.filter(q=>missed[q.id]);$("sumL").innerHTML=m.length?"<h3>Para repasar:</h3><ul>"+m.map(q=>`<li><b>${q.q}</b><br>✔️ ${q.t=="m"?q.o[0]:q.t=="v"?(q.a?"Verdadero":"Falso"):q.a} — ${q.e}</li>`).join("")+"</ul>":"<p>¡No tuviste errores! 🎉</p>";
$("rep").classList.toggle("hid",!m.length);show("sum")}
</script><div id="nmBox" style="display:none;position:fixed;inset:0;background:rgba(31,42,68,.55);z-index:99;align-items:center;justify-content:center;padding:16px">

<p style="font-size:1.05rem;margin:0 0 12px">Escribe tu nombre o tu apodo</p>
<input id="nmIn" maxlength="20" autocomplete="off" style="width:100%;font-size:1.4rem;padding:12px;border:2px solid #2b8de2;border-radius:12px;text-align:center">
<button type="submit" style="width:100%;font-size:1.3rem;padding:14px;margin-top:12px;border:0;border-radius:14px;background:#22a35a;color:#fff;font-weight:700;cursor:pointer">¡Listo! ✅</button>

<script>
(function(){
const K="sociales_nombre";
function clean(s){return (s||"").replace(/[<>"]/g,"").trim().slice(0,20)}
try{const q=clean(new URLSearchParams(location.search).get("nombre"));if(q)localStorage.setItem(K,q)}catch(e){}
window.NM=function(){try{return clean(localStorage.getItem(K))||"amiguito"}catch(e){return "amiguito"}};
function apply(){document.querySelectorAll(".nm").forEach(e=>e.textContent=NM());
const n=(function(){try{return clean(localStorage.getItem(K))}catch(e){return ""}})();
document.querySelectorAll("a[data-app]").forEach(a=>{a.href=a.dataset.app+(n?"?nombre="+encodeURIComponent(n):"")})}
window.cambiarNombre=function(){const b=document.getElementById("nmBox"),i=document.getElementById("nmIn");i.value=NM()=="amiguito"?"":NM();b.style.display="flex";i.focus()};
document.getElementById("nmForm").onsubmit=function(ev){ev.preventDefault();const v=clean(document.getElementById("nmIn").value);if(!v){document.getElementById("nmIn").focus();return}
try{localStorage.setItem(K,v)}catch(e){}document.getElementById("nmBox").style.display="none";apply()};
apply();
if(window.ASK_NAME&&NM()=="amiguito")cambiarNombre();
})();
</script>
</body></html>
